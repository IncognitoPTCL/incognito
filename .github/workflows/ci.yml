name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Byte parity with @solana/web3.js and @dha-team/arbundles
        run: npm test
      - name: Bundle the API for Vercel
        run: node build.mjs
      - name: Syntax check the browser code
        run: for f in public/*.js; do node --check "$f"; done
